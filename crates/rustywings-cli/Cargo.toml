[package]
name = "rustywings-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Headless runner for the rustyWings ecosystem: long runs, benchmarks, determinism checks and the learning test CI relies on."
license = "MIT"
repository = "https://github.com/mahim37/rustyWings"

[[bin]]
name = "rustywings"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

rustywings-core = { path = "../rustywings-core" }
